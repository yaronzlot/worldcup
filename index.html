<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #050510; --card: #0e0e20; --card2: #0a0a1a;
  --gold: #FFD700; --green: #22c55e; --red: #f87171;
  --blue: #3b82f6; --muted: #ffffff55; --border: #ffffff12;
  --draw: #a78bfa;
}
html, body { height: 100%; background: var(--bg); color: #fff;
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif; direction: rtl; overflow: hidden; }
#app { height: 100vh; display: flex; flex-direction: column; }
.bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 50% at 15% 5%, #00408022, transparent),
    radial-gradient(ellipse 50% 40% at 85% 90%, #cc000018, transparent),
    radial-gradient(ellipse 40% 60% at 50% 50%, #FFD70008, transparent); }
.header { z-index: 10; background: #080818; border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 14px; position: relative; z-index: 1; padding-bottom: 90px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: #080818; border-top: 1px solid var(--border); display: flex; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 9px 0 13px; border: none; background: transparent; color: #ffffff33;
  cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; transition: color 0.2s; }
.nav-btn.active { color: var(--gold); }
.nav-icon { font-size: 18px; margin-bottom: 2px; }
.toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 999;
  padding: 11px 20px; border-radius: 14px; font-size: 13px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 24px #00000066; white-space: nowrap; pointer-events: none; display: none; }
.sl { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 10px; }
.card { background: linear-gradient(135deg, var(--card), var(--card2));
  border-radius: 16px; border: 1px solid var(--border); padding: 13px; margin-bottom: 10px; }
.pill { flex-shrink: 0; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: #ffffff08; color: #ffffff66; font-size: 12px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: all 0.2s; white-space: nowrap; }
.pill.active { background: linear-gradient(135deg, #004080, #0070cc); border-color: transparent; color: #fff; }
.pills { display: flex; gap: 7px; margin-bottom: 13px; overflow-x: auto; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.mc { background: linear-gradient(135deg, var(--card), var(--card2));
  border-radius: 14px; border: 1px solid var(--border); padding: 12px; margin-bottom: 9px; transition: border-color 0.3s; }
.mc.pk { border-color: #FFD70030; }
.mc.correct { border-color: #22c55e55; background: linear-gradient(135deg,#081808,#060e06); }
.mc.wrong { border-color: #f8717133; background: linear-gradient(135deg,#180808,#0e0606); }
.tr3 { display: flex; align-items: stretch; gap: 5px; }
.tb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;

.tb:disabled { opacity: 0.4; cursor: not-allowed; }
.tb.sel-h { border-color: var(--gold); background: #FFD70015; box-shadow: 0 0 14px #FFD70025; }
.tb.sel-d { border-color: var(--draw); background: #a78bfa12; }
.tb.sel-a { border-color: var(--gold); background: #FFD70015; box-shadow: 0 0 14px #FFD70025; }
.tb.res { border-color: var(--green) !important; background: #22c55e10 !important; }
.tf { font-size: 22px; line-height: 1; }
.tn { font-size: 9px; font-weight: 700; color: #ffffffcc; text-align: center; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; padding: 0 2px; }
.ck { position: absolute; top: -5px; right: -5px; width: 15px; height: 15px;
  border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: 8px; }
.ck.draw { background: var(--draw); }
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;

.badge.ok { background: #22c55e15; color: var(--green); border: 1px solid #22c55e30; }
.badge.no { background: #f8717115; color: var(--red); border: 1px solid #f8717130; }
.badge.pend { background: #FFD70012; color: var(--gold); border: 1px solid #FFD70030; }
.score-disp { font-size: 15px; font-weight: 900; letter-spacing: 1px; color: #fff; }
.sb-main { width: 100%; padding: 14px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, #004080, #FFD700); color: #000;
  font-size: 15px; font-weight: 900; cursor: pointer; font-family: inherit; margin-top: 12px; }
.done-banner { background: #22c55e18; border: 1px solid #22c55e33; border-radius: 12px;
  padding: 12px; font-size: 13px; color: var(--green); font-weight: 700; text-align: center; margin-top: 10px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-box { background: var(--card); border-radius: 14px; border: 1px solid;
  padding: 11px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.lr { display: flex; align-items: center; gap: 10px; background: var(--card);
  border-radius: 14px; border: 1px solid var(--border); padding: 11px 14px; margin-bottom: 8px; }
.lr.me { border-color: #3b82f644; background: #3b82f610; }
.gt { background: var(--card); border-radius: 14px; border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
.gr { display: grid; grid-template-columns: 20px 1fr 22px 22px 22px 22px 26px;
  gap: 2px; padding: 8px 10px; border-bottom: 1px solid #ffffff07; align-items: center; font-size: 11px; }
.gr:last-child { border-bottom: none; }
.gr.q { background: #00408012; }
.reg { position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 22px; overflow-y: auto; }
.av { width: 46px; height: 46px; border-radius: 13px; font-size: 22px; border: 2px solid #ffffff15;

.av.pk2 { border-color: var(--gold); background: #FFD70020; transform: scale(1.12); }
.ri { width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid #ffffff18;

.ri:focus { border-color: var(--gold); }
.rb { width: 100%; max-width: 320px; padding: 14px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, #004080, var(--gold)); color: #000;
  font-size: 16px; font-weight: 900; cursor: pointer; font-family: inherit; opacity: 0.35; transition: opacity 0.2s; }
.rb:not(:disabled) { opacity: 1; }
.pt2 { height: 4px; background: #ffffff10; border-radius: 10px; overflow: hidden; margin-top: 4px; }
.pf { height: 100%; background: linear-gradient(90deg, #004080, var(--gold)); border-radius: 10px; transition: width 0.3s; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  display: inline-block; margin-right: 5px; animation: pulse 2s infinite; vertical-align: middle; }
.sync-dot.off { background: #f87171; animation: none; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #ffffff15;
  border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }

/* ── USER PICKS MODAL ── */
.picks-overlay { position: fixed; inset: 0; z-index: 200; background: #000000cc;
  display: flex; align-items: flex-end; justify-content: center; }
.picks-sheet { background: #0a0a1e; border-radius: 24px 24px 0 0; border: 1px solid #ffffff15;
  width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto; padding: 20px 16px 40px; }
.picks-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.picks-close { margin-right: auto; background: none; border: none; color: #ffffff55; font-size: 24px; cursor: pointer; line-height: 1; }
.pick-row { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
  border-radius: 11px; border: 1px solid #ffffff10; background: #ffffff06; margin-bottom: 6px; font-size: 12px; }
.pick-row.correct { border-color: #22c55e99; background: #22c55e28; color: #fff; }
.pick-row.wrong { border-color: #f8717199; background: #f8717128; color: #fff; }
.pick-row.pending { border-color: #FFD70033; background: #FFD7000a; }
/* ── ADMIN PANEL ── */
.admin-overlay { position: fixed; inset: 0; z-index: 200; background: #000000cc;
  display: flex; align-items: flex-end; justify-content: center; }
.admin-sheet { background: #0a0a1e; border-radius: 24px 24px 0 0; border: 1px solid #ff000033;
  width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; padding: 20px 16px 40px; }
.admin-title { font-size: 16px; font-weight: 900; color: #ff4444; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.admin-close { margin-right: auto; background: none; border: none; color: #ffffff55; font-size: 22px; cursor: pointer; }
.admin-match { background: #ffffff08; border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; border: 1px solid #ffffff10; }
.admin-match-name { font-size: 12px; font-weight: 800; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.res-btns { display: flex; gap: 6px; align-items: center; }
.res-btn { flex:1; padding: 7px 4px; border-radius: 9px; border: 1px solid #ffffff15;
  background: #ffffff08; color: #ffffffaa; font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit; transition: all 0.15s; text-align:center; }
.res-btn.active-h { background: #22c55e20; border-color: var(--green); color: var(--green); }
.res-btn.active-d { background: #a78bfa20; border-color: var(--draw); color: var(--draw); }
.res-btn.active-a { background: #f8717120; border-color: var(--red); color: var(--red); }
.score-inputs { display: flex; gap: 6px; align-items: center; margin-top: 7px; }
.score-inp { width: 44px; padding: 6px; border-radius: 8px; border: 1px solid #ffffff20;
  background: #ffffff08; color: #fff; font-size: 16px; font-weight: 900; text-align: center; font-family: inherit; outline: none; }
.score-inp:focus { border-color: var(--gold); }
.admin-apply { flex:1; padding: 8px; border-radius: 9px; border: none;

  font-size: 12px; font-weight: 900; cursor: pointer; font-family: inherit; }
.admin-apply:disabled { opacity: 0.35; cursor: not-allowed; }
.admin-reset-btn { width: 100%; padding: 13px; border-radius: 13px; border: none; margin-top: 8px;
  font-size: 14px; font-weight: 900; cursor: pointer; font-family: inherit; }
.admin-filter { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.admin-filter::-webkit-scrollbar { display: none; }

/* Admin password screen */
.admin-pass { position: fixed; inset: 0; z-index: 300; background: #000000dd;
  display: flex; align-items: center; justify-content: center; }
.admin-pass-box { background: #0a0a1e; border-radius: 20px; border: 1px solid #ff000044;
  padding: 28px 24px; width: 90%; max-width: 320px; text-align: center; }

@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
@keyframes bounceIn { 0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

/* ── PWA INSTALL BUTTON ── */
#pwaInstallBtn {

}
#pwaInstallBtn.visible { display: flex; }
</style>
</head>

    <div style="border-top:1px solid #ffffff10;margin-top:16px;padding-top:16px">
      <div style="font-size:12px;font-weight:800;color:#ff4444;margin-bottom:10px">⚠️ איפוס נתונים</div>

async function applyResult(id, hName, aName) {
  try {
    const hRaw=document.getElementById(`sh_${id}`).value.trim();
    const aRaw=document.getElementById(`sa_${id}`).value.trim();
    const hVal=hRaw!==''?parseInt(hRaw):NaN;
    const aVal=aRaw!==''?parseInt(aRaw):NaN;
    // אם הוכנס ניקוד בשני השדות — חשב תוצאה ממנו, אחרת השתמש בבחירה הידנית
    let finalR;
    if(hRaw!==''&&aRaw!==''&&!isNaN(hVal)&&!isNaN(aVal)){
      finalR = hVal>aVal?'h':aVal>hVal?'a':'d';
    } else {
      finalR = adminPicks[id]||RESULTS[id];
    }
    if(!finalR){ toast('⚠️ בחר תוצאה או הכנס ניקוד','#f59e0b'); return; }
    RESULTS[id]=finalR;
    if(!isNaN(hVal)&&!isNaN(aVal)) SCORES[id]={h:hVal,a:aVal};
    toast('⏳ שומר...','#3b82f6');
    await saveResults();
    await recalcAllUsers();
    renderAdminMatches();
    render();
    toast(`✅ תוצאה עודכנה: ${resultLabel(finalR,{h:hName,a:aName})}`,'#22c55e');
  } catch(e) {
    console.error('applyResult error:', e);
    toast('❌ שגיאה בשמירה: ' + e.message, '#f87171');
  }
}

async function clearResult(id){
  delete RESULTS[id]; delete SCORES[id]; delete adminPicks[id];
  await saveResults();
  await recalcAllUsers();
  renderAdminMatches(); render();
  toast('🗑️ תוצאה נמחקה','#f59e0b');
}

async function recalcAllUsers(){
  try {
    const snap=await getDocs(collection(db,'users'));
    const batch=writeBatch(db);
    snap.docs.forEach(d=>{
      const u=d.data();
      const pts=calcPts(u.P||{});
      batch.update(doc(db,'users',d.id),{pts,updatedAt:serverTimestamp()});
    });
    await batch.commit();
  } catch(e) {
    console.error('recalcAllUsers error:', e);
    throw e;
  }
}

// ── TheSportsDB ──
async function fetchResults(){
  try{
    const r=await fetch('https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=4429&s=2026-2027');
    const data=await r.json();
    if(!data.events)return;
    let changed=false;
    data.events.forEach(ev=>{
      const hSc=parseInt(ev.intHomeScore),aSc=parseInt(ev.intAwayScore);
      if(isNaN(hSc)||isNaN(aSc)||ev.strStatus!=='Match Finished')return;
      const hHe=EN2HE[ev.strHomeTeam],aHe=EN2HE[ev.strAwayTeam];
      if(!hHe||!aHe)return;
      const match=MX.find(m=>(m.h===hHe&&m.a===aHe)||(m.h===aHe&&m.a===hHe));
      if(!match)return;
      const flipped=match.h===aHe;
      const rH=flipped?aSc:hSc,rA=flipped?hSc:aSc;
      const res=rH>rA?'h':rA>rH?'a':'d';
      if(RESULTS[match.id]!==res){RESULTS[match.id]=res;SCORES[match.id]={h:rH,a:rA};changed=true;}
    });
    if(changed){await saveResults();await recalcAllUsers();render();}
    setSyncOnline(true);
  }catch(e){console.warn('API error',e);}
}

// ── SCORING ──
function calcPts(userP){
  return Object.entries(userP||{}).reduce((s,[id,p])=>RESULTS[id]&&RESULTS[id]===p?s+PTS:s,0);
}
function recalcPts(){
  if(!cur)return;
  const pts=calcPts(P),n=Object.keys(P).length+Object.keys(KP).length;
  setDoc(doc(db,'users',cur.id),{pts,n,updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});
}
function matchStatus(id){
  const r=RESULTS[id],p=P[id];
  if(!r)return 'future';
  if(!p)return 'missed';
  return r===p?'correct':'wrong';
}

    MX.filter(m=>(m.h===t||m.a===t)&&m.g===gk).forEach(m=>{
      const r=RESULTS[m.id];if(!r)return;pl++;
      const ih=m.h===t;
      if(r==='d'){d++;pts+=1;}else if((r==='h'&&ih)||(r==='a'&&!ih)){w++;pts+=3;}else l++;
    });
    return{t,f:GRP[gk].f[i],pl,w,d,l,pts};
  }).sort((a,b)=>b.pts-a.pts||b.w-a.w);
}

function levenshtein(a,b){
  a=a.toLowerCase();b=b.toLowerCase();
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

let _regAllUsers=[];

async function checkSimilarNames(name){
  const w=document.getElementById('similarNameWarning');
  if(!w)return;
  if(name.length<2){w.style.display='none';return;}

  if(!_regAllUsers.length&&db){
    try{
      const snap=await getDocs(collection(db,'users'));
      _regAllUsers=snap.docs.map(d=>d.data().nm||'');
    }catch(e){return;}
  }

  const exact=_regAllUsers.find(n=>n.trim().toLowerCase()===name.toLowerCase());
  if(exact){
    w.innerHTML=`✅ הכינוי "<strong>${exact}</strong>" כבר קיים — תתחבר אוטומטית לחשבון שלו!`;
    w.style.background='#22c55e18';w.style.borderColor='#22c55e55';w.style.color='#22c55e';
    w.style.display='block';return;
  }

  const similar=_regAllUsers.filter(n=>{
    const dist=levenshtein(name,n.trim());
    const maxLen=Math.max(name.length,n.trim().length);
    return dist>0&&dist<=Math.max(1,Math.floor(maxLen*0.35));
  });

  if(similar.length){
    w.innerHTML=`⚠️ שם דומה כבר קיים: <strong>${similar.join(', ')}</strong><br><span style="font-size:11px;opacity:0.8">אם זה אתה — כתוב את השם בדיוק כפי שנרשמת.</span>`;
    w.style.background='#f59e0b18';w.style.borderColor='#f59e0b55';w.style.color='#f59e0b';
    w.style.display='block';
  }else{w.style.display='none';}
}

  pwaBtn.classList.add('visible');

  // Auto-hide after 8 seconds
  setTimeout(() => pwaBtn.classList.remove('visible'), 8000);
});

window.pwaTriggerInstall = async function() {
  if (!pwaInstallEvent) return;
  pwaBtn.classList.remove('visible');
  pwaInstallEvent.prompt();
  const { outcome } = await pwaInstallEvent.userChoice;
  pwaInstallEvent = null;
};

// Hide button once installed
window.addEventListener('appinstalled', () => {
  pwaBtn.classList.remove('visible');
  pwaInstallEvent = null;
});
</script>
</body>
</html>
