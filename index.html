* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {

  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 14px; position: relative; z-index: 1; padding-bottom: 90px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;

  cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 700; transition: color 0.2s; }
.nav-btn.active { color: var(--gold); }
.nav-icon { font-size: 18px; margin-bottom: 2px; }
.toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 999;
  padding: 11px 20px; border-radius: 14px; font-size: 13px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 24px #00000066; white-space: nowrap; pointer-events: none; display: none; }
.sl { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase;

.card { background: linear-gradient(135deg, var(--card), var(--card2));

  cursor: pointer; font-family: inherit; transition: all 0.2s; white-space: nowrap; }
.pill.active { background: linear-gradient(135deg, #004080, #0070cc); border-color: transparent; color: #fff; }

.mc.pk { border-color: #FFD70030; }
.tr { display: flex; align-items: center; gap: 5px; }
.tb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 10px 6px; border-radius: 12px; border: 2px solid #ffffff12; background: #ffffff04;

.tb:disabled { opacity: 0.4; cursor: not-allowed; }
.tb.sel { border-color: var(--gold); background: #FFD70015; box-shadow: 0 0 16px #FFD70030; }
.tf { font-size: 28px; line-height: 1; }
.tn { font-size: 10px; font-weight: 700; color: #ffffffcc; text-align: center; line-height: 1.2; }
.ck { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;

.vs { flex-shrink: 0; font-size: 13px; font-weight: 900; color: #ffffff18; }
.pt { margin-top: 8px; font-size: 11px; color: #FFD700aa; text-align: center;

.sb { width: 100%; padding: 14px; border-radius: 14px; border: none;

.sb2 { background: var(--card); border-radius: 14px; border: 1px solid;

.gr:last-child { border-bottom: none; }
.gr.q { background: #00408012; }
.reg { position: fixed; inset: 0; z-index: 100; background: var(--bg);

.rb { width: 100%; max-width: 320px; padding: 14px; border-radius: 14px; border: none;

.pf { height: 100%; background: linear-gradient(90deg, #004080, var(--gold)); border-radius: 10px; transition: width 0.3s; }

  const m=sl.match(/^(\d+)([12])$/);
  if(m){ const q=qual(m[1],parseInt(m[2])-1); return q?{t:q.t,f:q.f}:null; }
  return null; // best-3rd: TBD
}

function buildBracket() {
  // R32
  const r32 = KO_PAIRS.r32.map(p=>{
    const t1 = resolveSlot(p.s1);
    const t2 = resolveSlot(p.s2);
    return {id:p.id,t1,t2};
  });
  // R16
  const r16=[];
  for(let i=0;i<8;i++){
    const m1=r32[i*2], m2=r32[i*2+1];
    const w1=KP[m1.id]?{t:KP[m1.id],f:flag(KP[m1.id])}:null;
    const w2=KP[m2.id]?{t:KP[m2.id],f:flag(KP[m2.id])}:null;
    r16.push({id:`r16_${i+1}`,t1:w1,t2:w2});
  }
  // QF
  const qf=[];
  for(let i=0;i<4;i++){
    const m1=r16[i*2], m2=r16[i*2+1];
    const w1=KP[m1.id]?{t:KP[m1.id],f:flag(KP[m1.id])}:null;
    const w2=KP[m2.id]?{t:KP[m2.id],f:flag(KP[m2.id])}:null;
    qf.push({id:`qf_${i+1}`,t1:w1,t2:w2});
  }
  // SF
  const sf=[];
  for(let i=0;i<2;i++){
    const m1=qf[i*2], m2=qf[i*2+1];
    const w1=KP[m1.id]?{t:KP[m1.id],f:flag(KP[m1.id])}:null;
    const w2=KP[m2.id]?{t:KP[m2.id],f:flag(KP[m2.id])}:null;
    sf.push({id:`sf_${i+1}`,t1:w1,t2:w2});
  }
  // Final
  const sf0=sf[0],sf1=sf[1];
  const fw1=KP[sf0.id]?{t:KP[sf0.id],f:flag(KP[sf0.id])}:null;
  const fw2=KP[sf1.id]?{t:KP[sf1.id],f:flag(KP[sf1.id])}:null;
  const fin=[{id:'final',t1:fw1,t2:fw2}];
  return {r32,r16,qf,sf,f:fin};
}

// Persist
function save() {
  if(!cur)return;
  const kn=Object.keys(KP).length, pn=Object.keys(P).length, tot=pn+kn;
  const ex=LB.find(u=>u.id===cur.id);
  if(ex){ex.pts=tot*3;ex.n=tot;}else LB.push({id:cur.id,nm:cur.nm,av:cur.av,pts:tot*3,n:tot});
  LB.sort((a,b)=>b.pts-a.pts);
  localStorage.setItem('wc26',JSON.stringify({cur,P,KP,SUB,LB}));
}
function load() {
  try{const d=JSON.parse(localStorage.getItem('wc26'));if(!d)return false;
    cur=d.cur;P=d.P||{};KP=d.KP||{};SUB=d.SUB||{};LB=d.LB||[];return true;}
  catch{return false;}
}

// Reg
function initReg(){
  const g=document.getElementById('avGrid');
  AVS.forEach(a=>{
    const b=document.createElement('button');
    b.className='av'+(a===aAV?' pk2':''); b.textContent=a;
    b.onclick=()=>{aAV=a; g.querySelectorAll('.av').forEach(x=>x.classList.remove('pk2')); b.classList.add('pk2');};
    g.appendChild(b);
  });
}
function onNI(){document.getElementById('regBtn').disabled=document.getElementById('nameIn').value.trim().length<2;}
function register(){
  const nm=document.getElementById('nameIn').value.trim();
  if(nm.length<2)return;
  cur={id:'u'+Date.now(),nm,av:aAV};
  document.getElementById('regOverlay').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('uChip').textContent=cur.av;
  save();render();toast(`ברוך הבא, ${nm}! ⚽`);
}
function showProf(){ const tot=Object.keys(P).length+Object.keys(KP).length; toast(`${cur.av} ${cur.nm} · ${tot*3} נק'`,'#3b82f6'); }

// Core
function toast(msg,col='#22c55e'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col;t.style.display='block';
  clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2800);
}
function setTab(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  window._tab=tab; render();
}
function render(){
  const c=document.getElementById('content'), t=window._tab||'predict';
  if(t==='predict') c.innerHTML=rPredict();
  else if(t==='knockout') c.innerHTML=rKO();
  else if(t==='groups') c.innerHTML=rGroups();
  else if(t==='leaders') c.innerHTML=rLeaders();
}

// ── PREDICT ──
function rPredict(){
  const key=`${aMD}_${aG}`, gm=MX.filter(m=>m.g===aG&&m.md===aMD), done=SUB[key];
  const filled=gm.filter(m=>P[m.id]!==undefined).length;
  let h='<div class="pills">';
  Object.keys(GRP).forEach(g=>{
    const ok=[1,2,3].every(md=>SUB[`${md}_${g}`]);
    h+=`<button class="pill ${g===aG?'active':''}" onclick="sG('${g}')">${ok?'✅':''}בית ${g}</button>`;
  });
  h+='</div><div class="pills" style="margin-top:-6px">';
  [1,2,3].forEach(md=>{
    const ok=SUB[`${md}_${aG}`];
    h+=`<button class="pill ${md===aMD?'active':''}" onclick="sMD(${md})">${ok?'✅':''}מחזור ${md}</button>`;
  });
  h+=`</div><div class="sl">⚽ בית ${aG} · מחזור ${aMD}</div>`;
  gm.forEach(m=>{ h+=rMC(m,done); });
  if(!done){
    const pct=gm.length?Math.round(filled/gm.length*100):0;
    h+=`<div style="margin-top:12px">
      <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:5px">${filled}/${gm.length} נבחרו</div>
      <div class="pt2"><div class="pf" style="width:${pct}%"></div></div>
    </div><button class="sb" onclick="subG()">שלח ניחושים 🎯</button>`;
  } else {
    h+=`<div class="done-banner">✅ בית ${aG} מחזור ${aMD} נשלח!</div>`;
  }
  return h;
}

function rMC(m,lock){
  const hf=flag(m.h),af=flag(m.a),p=P[m.id];
  return `<div class="mc ${p!==undefined?'pk':''}">
    <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:9px">
      <span style="color:#FFD70099;font-weight:700">📅 ${m.d}</span>
      <span style="color:#ffffff33;font-weight:700">בית ${m.g}</span>
    </div>
    <div class="tr">
      <button class="tb ${p==='h'?'sel':''}" ${lock?'disabled':''} onclick="pM(${m.id},'h')">
        ${p==='h'?'<span class="ck">✓</span>':''}
        <span class="tf">${hf}</span><span class="tn">${m.h}</span>
      </button>
      <div class="vs">VS</div>
      <button class="tb ${p==='a'?'sel':''}" ${lock?'disabled':''} onclick="pM(${m.id},'a')">
        ${p==='a'?'<span class="ck">✓</span>':''}
        <span class="tf">${af}</span><span class="tn">${m.a}</span>
      </button>
    </div>
    ${p!==undefined?`<div class="pt">✓ ניחוש: ${p==='h'?m.h:m.a}</div>`:''}
  </div>`;
}

function sG(g){aG=g;render();}
function sMD(md){aMD=md;render();}
function pM(id,s){
  if(SUB[`${aMD}_${aG}`])return;
  if(P[id]===s)delete P[id]; else P[id]=s;
  save();render();
}
function subG(){
  const gm=MX.filter(m=>m.g===aG&&m.md===aMD);
  if(gm.some(m=>P[m.id]===undefined)){toast('⚠️ בחר מנצחת לכל המשחקים','#f59e0b');return;}
  SUB[`${aMD}_${aG}`]=true; save();render(); toast('✅ ניחושים נשלחו!');
}

// ── KNOCKOUT ──
function rKO(){
  const br=buildBracket();
  const stages=[
    {k:'r32',lbl:'שלב 32',ic:'🗓️',dt:'28/06–03/07',mx:br.r32},
    {k:'r16',lbl:'שמינית גמר',ic:'⚡',dt:'04–07/07',mx:br.r16},
    {k:'qf', lbl:'רבע גמר',ic:'🔥',dt:'09–11/07',mx:br.qf},
    {k:'sf', lbl:'חצי גמר',ic:'💫',dt:'14–15/07',mx:br.sf},
    {k:'f',  lbl:'גמר',ic:'🏆',dt:'19/07',mx:br.f},
  ];

  const allGrpDone=Object.keys(GRP).every(g=>[1,2,3].every(md=>SUB[`${md}_${g}`]));

  let h='<div class="pills">';
  stages.forEach(s=>{
    const ok=s.mx.length&&s.mx.every(m=>KP[m.id]);
    h+=`<button class="pill ${aKS===s.k?'active':''}" onclick="sKS('${s.k}')">${ok?'✅':''}${s.ic} ${s.lbl}</button>`;
  });
  h+='</div>';

  const st=stages.find(s=>s.k===aKS);
  h+=`<div class="sl">${st.ic} ${st.lbl} · ${st.dt}</div>`;

  if(aKS==='r32'&&!allGrpDone){
    h+=`<div class="card" style="text-align:center;padding:24px">
      <div style="font-size:32px;margin-bottom:10px">🏟️</div>
      <div style="font-size:14px;font-weight:800;margin-bottom:6px">השלם קודם את שלב הבתים</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.6">לאחר שליחת כל ניחושי הגרופ סטייג', הנוקאאוט יתמלא אוטומטית לפי הניחושים שלך</div>
      <button onclick="setTab('predict')" style="margin-top:14px;padding:10px 20px;border-radius:12px;border:none;background:linear-gradient(135deg,#004080,var(--gold));color:#000;font-weight:900;cursor:pointer;font-family:inherit;font-size:13px">לניחושי הבתים 🎯</button>
    </div>`;
    return h;
  }

  st.mx.forEach(m=>{ h+=rKOM(m); });

  if(aKS==='f'&&KP['final']){
    h+=`<div style="margin-top:16px;background:linear-gradient(135deg,#1a1a00,#2a2200);border-radius:16px;border:1px solid #FFD70066;padding:20px;text-align:center">
      <div style="font-size:40px;margin-bottom:8px">🏆</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">האלוף שניחשת</div>
      <div style="font-size:24px;font-weight:900;color:var(--gold)">${flag(KP['final'])} ${KP['final']}</div>
    </div>`;
  }
  return h;
}

function rKOM(m){
  const pick=KP[m.id];
  const tBtn=(t,side)=>{
    if(!t) return `<button class="tb" disabled style="opacity:0.25">
      <span style="font-size:22px">❓</span>
      <span class="tn" style="color:#ffffff33">ממתין</span>
    </button>`;
    const sel=pick===t.t;
    return `<button class="tb ${sel?'sel':''}" onclick="pKO('${m.id}','${t.t.replace(/'/g,"\\'")}')">
      ${sel?'<span class="ck">✓</span>':''}
      <span class="tf" style="font-size:26px">${t.f}</span>
      <span class="tn">${t.t}</span>
    </button>`;
  };
  return `<div class="mc ${pick?'pk':''}">
    <div class="tr">
      ${tBtn(m.t1,'t1')}<div class="vs">VS</div>${tBtn(m.t2,'t2')}
    </div>
    ${pick?`<div class="pt">✓ ניחוש: ${flag(pick)} ${pick}</div>`:''}
  </div>`;
}

function sKS(s){aKS=s;render();}
function pKO(id,team){
  if(KP[id]===team)delete KP[id]; else KP[id]=team;
  save();render();
}

// ── GROUPS ──
function rGroups(){
  let h='<div class="pills">';
  Object.keys(GRP).forEach(g=>{
    h+=`<button class="pill ${g===aG?'active':''}" onclick="sGV('${g}')">בית ${g}</button>`;
  });
  h+='</div>';
  const s=standings(aG);
  h+=`<div class="gt">
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:900;color:var(--gold)">⚽ בית ${aG}</div>
    <div class="gr" style="font-size:9px;color:#ffffff33;font-weight:700">#<span>נבחרת</span><span style="text-align:center">מ'</span><span style="text-align:center">נ'</span><span style="text-align:center">ה'</span><span style="text-align:center;color:var(--gold)">נק'</span></div>`;
  s.forEach((r,i)=>{
    h+=`<div class="gr ${i<2?'q':''}">
      <span style="color:${i<2?'var(--gold)':'var(--muted)'};font-weight:900">${i+1}</span>
      <span style="display:flex;align-items:center;gap:5px">${r.f}<span style="font-size:11px;font-weight:700">${r.t}</span></span>
      <span style="text-align:center;color:var(--muted)">${r.pl}</span>
      <span style="text-align:center;color:var(--green)">${r.w}</span>
      <span style="text-align:center;color:var(--red)">${r.l}</span>
      <span style="text-align:center;font-weight:900;color:${i<2?'var(--gold)':'#ffffffcc'}">${r.pts}</span>
    </div>`;
  });
  h+=`</div><div style="font-size:10px;color:#ffffff22;text-align:center;margin-bottom:14px">🟡 שורות מודגשות = עולות לנוקאאוט</div>`;
  h+=`<div class="sl">📋 משחקי בית ${aG}</div>`;
  [1,2,3].forEach(md=>{
    h+=`<div style="font-size:11px;color:#FFD70088;font-weight:800;margin-bottom:6px;margin-top:${md>1?'12px':'0'}">מחזור ${md}</div>`;
    MX.filter(m=>m.g===aG&&m.md===md).forEach(m=>{
      const p=P[m.id];
      h+=`<div class="card" style="padding:9px 12px;margin-bottom:6px">
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px">
          <span>${flag(m.h)} ${m.h}</span>
          <span style="font-size:10px;color:${p?'var(--gold)':'#ffffff22'};font-weight:700">${p?'✓ '+(p==='h'?m.h:m.a):'📅 '+m.d}</span>
          <span>${m.a} ${flag(m.a)}</span>
        </div>
      </div>`;
    });
  });
  return h;
}
function sGV(g){aG=g;render();}

// ── LEADERS ──
function rLeaders(){
  const kn=Object.keys(KP).length, pn=Object.keys(P).length;
  let h=`<div class="sg">
    <div class="sb2" style="border-color:#FFD70044"><span style="font-size:20px">🎯</span><div style="font-size:20px;font-weight:900;color:var(--gold)">${pn}</div><div style="font-size:9px;color:var(--muted);font-weight:700">ניחושי בתים</div></div>
    <div class="sb2" style="border-color:#f8717144"><span style="font-size:20px">⚔️</span><div style="font-size:20px;font-weight:900;color:var(--red)">${kn}</div><div style="font-size:9px;color:var(--muted);font-weight:700">ניחושי נוקאאוט</div></div>
    <div class="sb2" style="border-color:#3b82f644"><span style="font-size:20px">⭐</span><div style="font-size:20px;font-weight:900;color:var(--blue)">${(pn+kn)*3}</div><div style="font-size:9px;color:var(--muted);font-weight:700">נק' פוטנציאל</div></div>
  </div><div class="sl">🏆 לוח מובילים</div>`;
  const medals=['🥇','🥈','🥉'];
  if(!LB.length){h+='<div style="text-align:center;color:#ffffff33;padding:40px;font-size:15px">אין שחקנים עדיין</div>';}
  else{
    LB.forEach((u,i)=>{
      const me=cur&&u.id===cur.id;
      const rank=i<3?medals[i]:`#${i+1}`;
      const col=i===0?'#FFD700':i===1?'#c0c0c0':i===2?'#cd7f32':me?'var(--blue)':'#ffffffcc';
      h+=`<div class="lr ${me?'me':''}">
        <span style="font-size:18px;width:28px;text-align:center">${rank}</span>
        <span style="font-size:24px">${u.av}</span>
        <div style="flex:1"><div style="font-size:14px;font-weight:800">${u.nm}${me?' (אני)':''}</div>
        <div style="font-size:11px;color:var(--muted)">${u.n||0} ניחושים</div></div>
        <div style="text-align:left"><div style="font-size:22px;font-weight:900;color:${col}">${u.pts||0}</div>
        <div style="font-size:9px;color:var(--muted);font-weight:700">נק'</div></div>
      </div>`;
    });
  }
  h+=`<div style="margin-top:18px;background:linear-gradient(135deg,#0e0e20,#080818);border-radius:16px;border:1px solid #3b82f633;padding:18px;text-align:center">
    <div style="font-size:16px;font-weight:800;margin-bottom:6px">📨 הזמן חברים!</div>
    <div style="font-size:13px;color:#ffffff55;margin-bottom:12px">שתף וכולם ינחשו יחד</div>
    <button onclick="cpL()" style="padding:10px 22px;border-radius:12px;border:1px solid #3b82f666;background:#3b82f620;color:var(--blue);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">📋 העתק קישור</button>
  </div>`;
  return h;
}
function cpL(){ try{navigator.clipboard.writeText(location.href);}catch{} toast('📋 הקישור הועתק!','#3b82f6'); }

// Init
initReg();
if(load()&&cur){
  document.getElementById('regOverlay').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('uChip').textContent=cur.av;
  render();
}
</script>
</body>
